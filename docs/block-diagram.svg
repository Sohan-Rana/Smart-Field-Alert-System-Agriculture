<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Arial, Helvetica, sans-serif">
  <title>Block diagram of the Smart Field Alert System</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d8a4e"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#0a1208"/>

  <!-- Power -->
  <rect x="330" y="20" width="160" height="50" rx="10" fill="#2a1f08" stroke="#d4a017" stroke-width="2"/>
  <text x="410" y="50" fill="#f5c842" font-size="16" font-weight="700" text-anchor="middle">Power Supply</text>
  <line x1="410" y1="70" x2="410" y2="130" stroke="#2d8a4e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- PIR -->
  <rect x="30" y="140" width="190" height="80" rx="10" fill="#10261a" stroke="#4ade80" stroke-width="2"/>
  <text x="125" y="173" fill="#4ade80" font-size="17" font-weight="700" text-anchor="middle">PIR Sensor</text>
  <text x="125" y="196" fill="#8a9e82" font-size="13" text-anchor="middle">detects motion</text>
  <line x1="220" y1="180" x2="320" y2="180" stroke="#2d8a4e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="270" y="170" fill="#8a9e82" font-size="12" text-anchor="middle">signal (D2)</text>

  <!-- Arduino -->
  <rect x="330" y="140" width="160" height="80" rx="10" fill="#0f2850" stroke="#2a5a9e" stroke-width="2"/>
  <text x="410" y="173" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Arduino Uno</text>
  <text x="410" y="196" fill="#8a9e82" font-size="13" text-anchor="middle">processes and decides</text>

  <!-- Outputs -->
  <line x1="490" y1="165" x2="600" y2="85" stroke="#2d8a4e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="490" y1="180" x2="600" y2="180" stroke="#2d8a4e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="490" y1="195" x2="600" y2="275" stroke="#2d8a4e" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="610" y="55" width="260" height="60" rx="10" fill="#2a0f0f" stroke="#ef4444" stroke-width="2"/>
  <text x="740" y="82" fill="#ef4444" font-size="16" font-weight="700" text-anchor="middle">Red LED (D7)</text>
  <text x="740" y="102" fill="#8a9e82" font-size="12" text-anchor="middle">ON when motion is detected</text>

  <rect x="610" y="150" width="260" height="60" rx="10" fill="#10261a" stroke="#4ade80" stroke-width="2"/>
  <text x="740" y="177" fill="#4ade80" font-size="16" font-weight="700" text-anchor="middle">Green LED (D6)</text>
  <text x="740" y="197" fill="#8a9e82" font-size="12" text-anchor="middle">ON in normal condition</text>

  <rect x="610" y="245" width="260" height="60" rx="10" fill="#2a1f08" stroke="#d4a017" stroke-width="2"/>
  <text x="740" y="272" fill="#f5c842" font-size="16" font-weight="700" text-anchor="middle">Buzzer (D8)</text>
  <text x="740" y="292" fill="#8a9e82" font-size="12" text-anchor="middle">sounds when motion is detected</text>

  <text x="30" y="340" fill="#8a9e82" font-size="12">Smart Field Alert System - block diagram</text>
</svg>
